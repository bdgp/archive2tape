apiVersion: batch/v1
kind: CronJob
metadata:
  name: tape-db-backup
  namespace: db-backup
spec:
  concurrencyPolicy: Forbid
           # ┌───────────── minute (0 - 59)
           # │ ┌───────────── hour (0 - 23)
           # │ │ ┌───────────── day of the month (1 - 31)
           # │ │ │ ┌───────────── month (1 - 12)
           # │ │ │ │ ┌───────────── day of the week (0 - 6) (Sunday to Saturday;
           # * * * * *
  schedule: '0 0 * * *'
  suspend: true
  jobTemplate:
    spec:
      template:
        spec:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                    - ubx
          containers:
          - image: "fiji:443/bdgp/archive2tape"
            name: db-backup
            imagePullPolicy: Always
            securityContext:
              privileged: true
              capabilities:
                add:
                - SYS_ADMIN
            command:
            - bash
            - -c
            - |
              set -eu -o pipefail
              set -x
              ln -s /proc/self/mounts /etc/mtab
              suexec="$(readlink /bin/su-exec)"
              rm /bin/su-exec
              cp "$suexec" /bin/su-exec
              chmod u=s,go=x /bin/su-exec

              # /data/iarpa
              #(cd /data/iarpa && mountpoint .) && su-exec bbooth archive2tape --db /srv/tape-archives/db/iarpa.db --log /srv/tape-archives/log/iarpa.log --create-db --mount-command 'su-exec root nsenter -t 1 -m -u -i -n -p systemctl start ltfs' --unmount-command 'su-exec root fusermount -u /media/lto8/%l' backup /data/iarpa /data/felix_transition_materials

              # /data/teirex
              (cd /data/teirex && mountpoint .) && su-exec bbooth archive2tape --db /srv/tape-archives/db/teirex.db --log /srv/tape-archives/log/teirex.log --create-db --mount-command 'su-exec root nsenter -t 1 -m -u -i -n -p systemctl start ltfs' --unmount-command 'su-exec root fusermount -u /media/lto8/%l' backup /data/teirex

              # /mnt/local/teirex
              (cd /mnt/local/teirex && mountpoint .) && su-exec bbooth archive2tape --db /srv/tape-archives/db/mnt-local-teirex.db --log /srv/tape-archives/log/mnt-local-teirex.log --create-db --mount-command 'su-exec root nsenter -t 1 -m -u -i -n -p systemctl start ltfs' --unmount-command 'su-exec root fusermount -u /media/lto8/%l' backup /mnt/local/teirex

              # /data/flash_ldrd
              (cd /data/flash_ldrd && mountpoint .) && su-exec bbooth archive2tape --db /srv/tape-archives/db/flash_ldrd.db --log /srv/tape-archives/log/flash_ldrd.log --create-db --mount-command 'su-exec root nsenter -t 1 -m -u -i -n -p systemctl start ltfs' --unmount-command 'su-exec root fusermount -u /media/lto8/%l' backup /data/flash_ldrd

              # /data/seqdata
              (cd /data/seqdata && mountpoint .) && su-exec bbooth archive2tape --db /srv/tape-archives/db/seqdata.db --log /srv/tape-archives/log/seqdata.log --create-db --mount-command 'su-exec root nsenter -t 1 -m -u -i -n -p systemctl start ltfs' --unmount-command 'su-exec root fusermount -u /media/lto8/%l' backup /data/seqdata

              # /data/analysis
              (cd /data/analysis && mountpoint .) && su-exec bbooth archive2tape --db /srv/tape-archives/db/analysis.db --log /srv/tape-archives/log/analysis.log --create-db --mount-command 'su-exec root nsenter -t 1 -m -u -i -n -p systemctl start ltfs' --unmount-command 'su-exec root fusermount -u /media/lto8/%l' backup /data/analysis

              # /data/insitu-production
              (cd /data/insitu-production && mountpoint .) && su-exec bbooth archive2tape --db /srv/tape-archives/db/insitu-production.db --log /srv/tape-archives/log/insitu-production.log --create-db --mount-command 'su-exec root nsenter -t 1 -m -u -i -n -p systemctl start ltfs' --unmount-command 'su-exec root fusermount -u /media/lto8/%l' backup /data/insitu-production

              # /data/insitu-public
              (cd /data/insitu-public && mountpoint .) && su-exec bbooth archive2tape --db /srv/tape-archives/db/insitu-public.db --log /srv/tape-archives/log/insitu-public.log --create-db --mount-command 'su-exec root nsenter -t 1 -m -u -i -n -p systemctl start ltfs' --unmount-command 'su-exec root fusermount -u /media/lto8/%l' backup /data/insitu-public

              # /data/smorf
              (cd /data/smorf && mountpoint .) && su-exec bbooth archive2tape --db /srv/tape-archives/db/smorf.db --log /srv/tape-archives/log/smorf.log --create-db --mount-command 'su-exec root nsenter -t 1 -m -u -i -n -p systemctl start ltfs' --unmount-command 'su-exec root fusermount -u /media/lto8/%l' backup /data/smorf

              su-exec bbooth sqlite-backup /srv/tape-archives/db
              su-exec bbooth rsync -av /srv/tape-archives/log /backup/
            volumeMounts:
            - mountPath: /backup
              name: backup
            - mountPath: /data
              mountPropagation: HostToContainer
              name: data
            - mountPath: /users
              mountPropagation: HostToContainer
              name: users
            - mountPath: /mnt
              mountPropagation: HostToContainer
              name: mnt
            - mountPath: /srv
              mountPropagation: HostToContainer
              name: srv
            - mountPath: /dev/fuse
              mountPropagation: HostToContainer
              name: fuse
            - mountPath: /dev/tape
              mountPropagation: HostToContainer
              name: tape
            - mountPath: /media
              mountPropagation: Bidirectional
              name: media
            - mountPath: /var/run/nscd
              mountPropagation: HostToContainer
              name: nscd
            - mountPath: /tmp
              name: tmp
          volumes:
          - nfs:
              server: boss
              path: /volume1/db-backup/tape-archives
            name: backup
          - hostPath:
              path: /data
              type: ""
            name: data
          - hostPath:
              path: /users
              type: ""
            name: users
          - hostPath:
              path: /mnt
              type: ""
            name: mnt
          - hostPath:
              path: /srv
              type: ""
            name: srv
          - hostPath:
              path: /dev/fuse
              type: ""
            name: fuse
          - hostPath:
              path: /dev/tape
              type: ""
            name: tape
          - hostPath:
              path: /media
              type: ""
            name: media
          - hostPath:
              path: /var/run/nscd
              type: ""
            name: nscd
          - hostPath:
              path: /srv/tape-archives/tmp
              type: ""
            name: tmp
          hostAliases:
          - ip: 192.168.0.50
            hostnames: ['boss']
          restartPolicy: Never
          nodeName: ubx
          hostNetwork: true
          hostPID: true
          hostIPC: true
