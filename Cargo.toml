[package]
name = "archive2tape"
version = "1.0.0"
edition = "2021"
authors = ["Ben Booth <benwbooth@gmail.com>"]

[dependencies]
regex = "*"
duct = "*"
stable-eyre = "*"
color-eyre = "*"
glob = "*"
lazy_static = "*"
lazy-regex = "*"
which = "*"
sysinfo = "*"
stfu8 = "*"
chrono = "*"
rand = "*"
filetime = "*"
linked-hash-map = "*"
num_enum = "*"
walkdir = "*"
dateparser = "*"
nix = {version = "*", features = ["user", "fs"]}
csv = "*"
file-mode = "*"
users = "*"
log = "*"
serde = "*"
serde_rusqlite = "*"
serde_derive = "*"
shell-escape = "*"
pager = "*"
sha2 = "*"
hex = "*"
reflink-copy = "*"
shell-quote = "*"
format-bytes = "*"
threadpool = "*"
tabled = "*"
derive_more = "*"

[dependencies.clap]
version = "*"
features = [ "derive" ]

[dependencies.uuid]
version = "*"
features = [ "v4" ]

[dependencies.rusqlite]
version = "*"
features = [ "bundled" ]

[dependencies.flexi_logger]
version = "*"
features = [ "compress" ]

[dependencies.log-panics]
version = "*"
features = [ "with-backtrace" ]


#[profile.dev]
#opt-level = 2

[profile.dev.package.backtrace]
opt-level = 3

[[bin]]
name = "archive2tape"
path = "src/main.rs"
