[package]
name = "tape-archives"
version = "0.1.0"
edition = "2021"
authors = ["Ben Booth <benwbooth@gmail.com>"]

[dependencies]
regex = "*"
clap = "*"
structopt = "*"
structopt-derive = "*"
duct = "*"
eyre = "*"
color-eyre = "*"
glob = "*"
lazy_static = "*"
lazy-regex = "*"
which = "*"
sysinfo = "*"
stfu8 = "*"
chrono = "*"
rand = "*"
filetime = "*"
linked-hash-map = "*"
num_enum = "*"
walkdir = "*"
dateparser = "*"
nix = "*"
csv = "*"
file-mode = "*"
users = "*"
log = "*"
flexi_logger = "*"
ctrlc = "*"

[dependencies.uuid]
version = "*"
features = [ "v4" ]

[dependencies.rusqlite]
version = "*"
features = [ "bundled" ]

#[profile.dev]
#opt-level = 2

[[bin]]
name = "archive2tape"
path = "src/main.rs"
